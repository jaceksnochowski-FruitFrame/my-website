<style>
  :root{
    --bg:#0a0a0a;
    --text:#f2ede5;
    --muted:rgba(242,237,229,0.72);
    --soft:rgba(242,237,229,0.46);
    --line:rgba(242,237,229,0.1);
    --accent:#b8864c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Manrope",sans-serif}
  body{min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit}
  header{padding:1.5rem clamp(1.25rem,4vw,3rem);border-bottom:1px solid var(--line)}
  .brand{font-size:0.95rem;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none}
  main{flex:1;display:flex;align-items:center;padding:clamp(3rem,8vw,7rem) clamp(1.25rem,4vw,3rem)}
  .wrap{max-width:44rem}
  .eyebrow{font-size:0.75rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--soft);margin:0 0 1rem}
  h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1;margin:0 0 1.25rem;font-weight:700;letter-spacing:-0.02em}
  p{color:var(--muted);font-size:1.05rem;line-height:1.7;margin:0 0 2rem}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0.75rem}
  li a{display:inline-flex;align-items:center;min-height:44px;padding:0.7rem 1.2rem;border:1px solid var(--line);text-decoration:none;font-size:0.9rem;letter-spacing:0.04em;transition:border-color .2s}
  li a:hover,li a:focus-visible{border-color:var(--accent)}
  li:first-child a{background:var(--text);color:var(--bg);border-color:var(--text)}
  footer{padding:1.5rem clamp(1.25rem,4vw,3rem);border-top:1px solid var(--line);color:var(--soft);font-size:0.85rem}
</style>
</head>
<body>
<header><a class="brand" href="/">Jacek Snochowski</a></header>
<main>
